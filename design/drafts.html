<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>끝말잇기 사전 시안</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Gaegu:wght@400;700&family=Gowun+Dodum&family=Jua&family=Nanum+Pen+Script&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;font-family:"Gowun Dodum",sans-serif;background:#f3f4f6;color:#1d2433}
ul{list-style:none;margin:0;padding:0}
button{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid #ffbf00;outline-offset:2px}

/* 시안 고르는 막대 */
.picker{position:sticky;top:0;z-index:10;display:flex;gap:8px;align-items:center;overflow-x:auto;padding:10px 16px;background:#fff;border-bottom:1px solid #d9dde3}
.picker button{min-height:44px;padding:8px 16px;border:1px solid #c9ced6;border-radius:999px;background:#fff;color:#1d2433;font-size:16px;white-space:nowrap}
.picker button[aria-selected=true]{background:#1d2433;border-color:#1d2433;color:#fff}
.picker .note{margin-left:auto;font-size:13px;color:#667085;white-space:nowrap}
.draft{display:none;min-height:calc(100vh - 65px)}
.draft.on{display:block}
.wrap{max-width:760px;margin:0 auto;padding:28px 16px 64px}
.search{scroll-margin-top:80px}
.search input{font:inherit;border:0;background:none;color:inherit;text-align:center;padding:0;width:100%}

/* ───── A. 받아쓰기 공책 ───── */
.a{background:#dfe6ee;color:#22324f}
.a .paper{position:relative;padding:28px 20px 40px 60px;background:#fff repeating-linear-gradient(transparent 0 39px,#cfe0f5 39px 40px);background-attachment:local;border-radius:4px;box-shadow:0 1px 0 #c3ccd8,0 6px 0 -2px #fff,0 7px 0 -2px #c3ccd8}
.a .paper::before{content:"";position:absolute;left:42px;top:0;bottom:0;width:2px;background:#f19aa5}
.a h1{margin:0 0 20px;font:400 48px/1 "Nanum Pen Script",cursive;color:#1f3a68}
.a .search{display:flex;align-items:center;gap:18px;margin-bottom:24px}
.a .cell{width:96px;height:96px;flex:none;border:2px solid #e05a6a;background:linear-gradient(#f7c6cc,#f7c6cc) center/100% 1px no-repeat,linear-gradient(#f7c6cc,#f7c6cc) center/1px 100% no-repeat,#fff}
.a .cell input{height:100%;font-size:60px;color:#1f3a68}
.a .search p{margin:0;font-size:17px;line-height:1.5}
.a .sum{margin:0 0 8px;font:400 28px/40px "Nanum Pen Script",cursive;color:#d7263d}
.a h2{margin:24px 0 0;font:400 30px/40px "Nanum Pen Script",cursive;color:#1f3a68}
.a .row{padding:8px 0 12px;border-bottom:1px dashed #b9c7da}
.a .top{display:flex;align-items:center;gap:12px}
.a .word{font-size:28px;line-height:40px}
.a .stamp{display:inline-grid;place-items:center;width:46px;height:46px;border:2px solid currentColor;border-radius:50%;font:400 22px/1 "Nanum Pen Script",cursive;transform:rotate(-10deg)}
.a .stamp.g1,.a .stamp.g2{color:#d7263d}
.a .stamp.g3{color:#2563eb}
.a .mean{margin:2px 0 8px;font-size:18px;line-height:1.6}
.a .next{min-height:48px;padding:6px 14px;border:2px solid #1f3a68;border-radius:10px;background:#fff;color:#1f3a68;font-size:17px}
.a .next span{margin-left:6px;color:#d7263d;font-weight:700}
.a .end{margin:0;font:400 24px/1.4 "Nanum Pen Script",cursive;color:#d7263d}
.a .trail{margin:0 0 12px;font:400 26px/40px "Nanum Pen Script",cursive;color:#55657f}
.a .empty{font-size:18px;line-height:1.6}

/* ───── B. 끝말 기차 ───── */
.b{background:linear-gradient(#bfe6ff,#e6f6ff 60%,#d3f0c4 60%) fixed;color:#1f2d3d;font-family:"Jua",sans-serif}
.b h1{margin:0 0 34px;font-size:44px;font-weight:400;color:#c92a2a}
.b .engine{position:relative;display:flex;align-items:center;gap:18px;padding:22px 24px;margin-bottom:56px;background:#e8483f;color:#fff;border-radius:28px 28px 10px 10px}
.b .engine::before{content:"";position:absolute;top:-30px;left:36px;width:40px;height:32px;background:#3b3b4f;border-radius:8px 8px 0 0}
.b .engine::after{content:"";position:absolute;bottom:-18px;left:30px;right:30px;height:30px;background:radial-gradient(circle at 18px 15px,#3b3b4f 11px,#9aa0b4 12px 15px,transparent 16px) left/72px 30px space no-repeat}
.b .window{width:96px;height:96px;flex:none;border-radius:50%;background:#fff;border:6px solid #ffd43b}
.b .window input{height:100%;font-size:54px;color:#c92a2a}
.b .engine p{margin:0;font-size:22px;line-height:1.4}
.b .sum{margin:0 0 18px;font-size:22px}
.b h2{margin:30px 0 16px;font-size:24px;font-weight:400}
.b .car{position:relative;display:grid;grid-template-columns:1fr auto;gap:6px 16px;align-items:center;padding:18px 20px;margin-bottom:38px;border-radius:16px 16px 8px 8px;background:#ffd43b}
.b .car.g3{background:#b197fc}
.b .car::before,.b .car::after{content:"";position:absolute;bottom:-17px;width:30px;height:30px;border-radius:50%;background:#3b3b4f;border:5px solid #9aa0b4}
.b .car::before{left:28px}.b .car::after{right:28px}
.b .word{font-size:34px}
.b .tag{display:inline-block;margin-left:8px;padding:3px 10px;border-radius:999px;background:#fff;font-size:15px;vertical-align:middle}
.b .mean{grid-column:1/-1;margin:0;font-family:"Gowun Dodum",sans-serif;font-size:18px;line-height:1.6}
.b .hook{grid-row:1;grid-column:2;display:grid;place-items:center;width:64px;height:64px;border-radius:50%;background:#fff;font-size:30px;color:#c92a2a;box-shadow:inset 0 0 0 4px #3b3b4f}
.b .next{grid-column:1/-1;justify-self:start;min-height:50px;padding:8px 18px;border:0;border-radius:12px;background:#3b3b4f;color:#fff;font-size:19px}
.b .end{grid-column:1/-1;margin:0;font-size:19px;color:#c92a2a}
.b .trail{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:-30px 0 26px;font-size:18px}
.b .trail span{padding:6px 12px;border-radius:8px;background:#fff}
.b .trail i{width:14px;height:4px;background:#3b3b4f}
.b .empty{font-family:"Gowun Dodum",sans-serif;font-size:18px;line-height:1.6}

/* ───── C. 낱말 도감 ───── */
.c{background:radial-gradient(circle at 50% -20%,#4a3a9a,#231a4e 60%) fixed;color:#efeafd}
.c h1{margin:0 0 6px;font:400 46px/1.1 "Black Han Sans",sans-serif;color:#f2c14e}
.c .lead{margin:0 0 24px;font-size:17px;color:#c9c0ee}
.c .search{display:flex;align-items:center;gap:16px;padding:14px 18px;margin-bottom:22px;border:2px solid #f2c14e;border-radius:16px;background:#2d2264}
.c .slot{width:80px;height:80px;flex:none;border-radius:12px;background:#f2c14e}
.c .slot input{height:100%;font:400 50px/1 "Black Han Sans",sans-serif;color:#231a4e}
.c .search p{margin:0;font-size:18px;line-height:1.5}
.c .sum{margin:0 0 14px;font-size:20px}
.c .sum b{color:#f2c14e}
.c h2{margin:28px 0 14px;font:400 24px/1 "Black Han Sans",sans-serif;color:#f2c14e}
.c .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.c .card{display:flex;flex-direction:column;gap:8px;padding:18px;border:3px solid #f2c14e;border-radius:18px;background:#31266b}
.c .card.end{border-color:transparent;background:linear-gradient(#31266b,#31266b) padding-box,conic-gradient(#f2c14e,#ff8fd8,#7fe3ff,#b8ff9e,#f2c14e) border-box}
.c .stars{font-size:18px;color:#f2c14e;letter-spacing:2px}
.c .stars small{margin-left:6px;font-size:14px;letter-spacing:0;color:#c9c0ee}
.c .word{font:400 36px/1.1 "Black Han Sans",sans-serif}
.c .mean{flex:1;margin:0;font-size:17px;line-height:1.6;color:#ddd6f7}
.c .power{display:flex;align-items:center;gap:8px;font-size:15px;color:#c9c0ee}
.c .power meter{flex:1;height:10px}
.c .next{min-height:48px;border:0;border-radius:12px;background:#f2c14e;color:#231a4e;font-size:17px;font-weight:700}
.c .badge{align-self:flex-start;padding:6px 12px;border-radius:999px;background:linear-gradient(90deg,#ff8fd8,#7fe3ff);color:#231a4e;font-weight:700}
.c .trail{margin:0 0 16px;font-size:16px;color:#c9c0ee}
.c .empty{font-size:18px;line-height:1.6}

/* ───── D. 교실 칠판 ───── */
.d{background:#e9dccb;font-family:"Gaegu",cursive}
.d .board{padding:30px 26px 40px;background:#2f4a3c radial-gradient(circle at 30% 20%,#3a5a49,#2f4a3c 70%);border:16px solid #8b5a2b;border-radius:8px;box-shadow:inset 0 0 70px rgba(0,0,0,.35);color:#f4f4ee;text-shadow:0 0 1px rgba(255,255,255,.55)}
.d .tray{height:14px;margin:0 24px;background:#a06a3a;border-radius:0 0 8px 8px}
.d h1{margin:0 0 22px;font-size:46px;font-weight:700}
.d .search{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px;margin-bottom:22px;font-size:28px}
.d .chalkbox{width:88px;border-bottom:4px solid #f6e27f}
.d .chalkbox input{font:700 58px/1.1 "Gaegu",cursive;color:#f6e27f}
.d .sum{margin:0 0 10px;font-size:24px;color:#cfe3d6}
.d h2{display:inline-block;margin:24px 0 10px;font-size:30px;font-weight:700;border-bottom:3px solid #f4a6b7}
.d .row{padding:12px 0;border-bottom:2px dashed rgba(244,244,238,.25)}
.d .word{font-size:36px;font-weight:700}
.d .mark{display:inline-block;margin-left:10px;padding:0 10px;border:2px solid;border-radius:50%;font-size:20px;vertical-align:middle}
.d .mark.g1,.d .mark.g2{color:#f6e27f}
.d .mark.g3{color:#f4a6b7}
.d .mean{margin:2px 0 6px;font-size:23px;line-height:1.4}
.d .next{min-height:48px;padding:4px 0;border:0;background:none;color:#9fd8ff;font-size:24px;text-decoration:underline;text-underline-offset:5px}
.d .end{margin:0;font-size:24px;color:#f4a6b7}
.d .trail{margin:0 0 10px;font-size:24px;color:#cfe3d6}
.d .empty{font-size:24px}

@media (max-width:520px){
  .a .paper{padding-left:44px}.a .paper::before{left:30px}
  .a h1,.b h1,.c h1,.d h1{font-size:38px}
  .d .board{padding:22px 16px 30px;border-width:10px}
}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>
<body>

<nav class="picker" role="tablist">
  <button role="tab" data-to="a">A 받아쓰기 공책</button>
  <button role="tab" data-to="b">B 끝말 기차</button>
  <button role="tab" data-to="c">C 낱말 도감</button>
  <button role="tab" data-to="d">D 교실 칠판</button>
  <span class="note">예시 단어 40여 개, 뜻은 임시 문장</span>
</nav>

<section class="draft a" id="s-a"><div class="wrap"><div class="paper">
  <h1>끝말잇기 낱말 공책</h1>
  <label class="search">
    <span class="cell"><input aria-label="첫 글자" autocomplete="off"></span>
    <p>칸에 글자 하나를 쓰면<br>그 글자로 시작하는 낱말이 나와요.</p>
  </label>
  <div class="out"></div>
</div></div></section>

<section class="draft b" id="s-b"><div class="wrap">
  <h1>끝말 기차</h1>
  <label class="search engine">
    <span class="window"><input aria-label="첫 글자" autocomplete="off"></span>
    <p>어떤 글자로<br>출발할까요?</p>
  </label>
  <div class="out"></div>
</div></section>

<section class="draft c" id="s-c"><div class="wrap">
  <h1>낱말 도감</h1>
  <p class="lead">글자를 넣고 낱말 카드를 모아 보세요.</p>
  <label class="search">
    <span class="slot"><input aria-label="첫 글자" autocomplete="off"></span>
    <p>이 글자로 시작하는<br>카드를 찾아요.</p>
  </label>
  <div class="out"></div>
</div></section>

<section class="draft d" id="s-d"><div class="wrap">
  <div class="board">
    <h1>오늘의 끝말잇기</h1>
    <label class="search">
      <span class="chalkbox"><input aria-label="첫 글자" autocomplete="off"></span>
      <span>(으)로 시작하는 말은?</span>
    </label>
    <div class="out"></div>
  </div>
  <div class="tray"></div>
</div></section>

<script>
// [낱말, 등급(1~2: 초2, 3: 도전), 뜻] — 시안용 임시 데이터
const WORDS = [
  ["기차",1,"철길 위를 달리는, 여러 칸이 길게 이어진 차."],
  ["기린",1,"목과 다리가 아주 긴, 무늬가 있는 동물."],
  ["기분",1,"마음에 생기는 즐겁거나 슬픈 느낌."],
  ["기름",2,"물에 섞이지 않고 불에 잘 타는 미끈한 액체."],
  ["기억",2,"지나간 일을 잊지 않고 머릿속에 간직함."],
  ["기온",3,"공기가 따뜻하고 차가운 정도."],
  ["기적",3,"보통으로는 일어나기 어려운 놀라운 일."],
  ["차례",2,"여럿이 순서대로 돌아가는 것."],
  ["차표",2,"차를 탈 때 돈을 내고 받는 표."],
  ["차도",3,"자동차가 다니는 길."],
  ["인형",1,"사람이나 동물 모양으로 만든 장난감."],
  ["인사",1,"만나거나 헤어질 때 예의를 나타내는 말이나 행동."],
  ["분수",2,"물을 위로 뿜어 올리는 장치."],
  ["분필",2,"칠판에 글씨를 쓰는 하얀 막대."],
  ["온도",2,"따뜻하고 차가운 정도를 나타내는 숫자."],
  ["적군",3,"싸움에서 상대편 군대."],
  ["군인",2,"나라를 지키는 일을 하는 사람."],
  ["표정",2,"마음속 느낌이 얼굴에 드러난 모습."],
  ["도시",2,"사람이 많이 모여 사는 큰 마을."],
  ["도토리",1,"참나무에 열리는 동그란 열매."],
  ["도서관",2,"책을 모아 두고 누구나 읽을 수 있게 한 곳."],
  ["수박",1,"속이 빨갛고 물이 많은 여름 과일."],
  ["수영",1,"물속에서 팔다리를 움직여 헤엄치는 것."],
  ["사과",1,"빨갛고 동그란, 새콤달콤한 과일."],
  ["사랑",1,"아끼고 소중하게 여기는 마음."],
  ["형제",2,"형과 아우."],
  ["예절",3,"예의에 맞는 바른 몸가짐과 말."],
  ["시계",1,"시간을 알려 주는 물건."],
  ["이름",1,"사람이나 물건을 다른 것과 구별해 부르는 말."],
  ["이불",1,"잘 때 몸을 덮는 두꺼운 천."],
  ["박수",1,"기쁘거나 칭찬할 때 두 손뼉을 마주 치는 것."],
  ["과자",1,"밀가루나 설탕으로 만든 맛있는 간식."],
  ["자동차",1,"엔진의 힘으로 길을 달리는 차."],
  ["자석",2,"쇠붙이를 끌어당기는 물건."],
  ["정원",2,"집 안에 꽃과 나무를 가꾸어 놓은 뜰."],
  ["영화",2,"움직이는 그림과 소리로 이야기를 보여 주는 것."],
  ["화분",1,"꽃이나 풀을 심어 기르는 그릇."],
  ["계단",1,"오르내릴 수 있게 층층이 만든 길."],
  ["제비",2,"봄에 날아오는 작은 새."],
  ["비행기",1,"하늘을 나는 탈것."],
  ["필통",1,"연필이나 지우개를 넣는 통."],
  ["불꽃",2,"불이 타면서 일어나는 빛."],
  ["원숭이",1,"나무를 잘 타고 흉내를 잘 내는 동물."],
  ["단추",1,"옷을 여미는 작고 동그란 물건."]
].map(([word,grade,meaning]) => ({word,grade,meaning}));

// 두음법칙: 첫소리 ㄹ → ㄴ/ㅇ, ㄴ → ㅇ (ㅑㅒㅕㅖㅛㅠㅣ 앞)
function dueum(s){
  const c = s.charCodeAt(0) - 0xAC00;
  if (c < 0 || c > 11171) return s;
  let cho = Math.floor(c / 588);
  const jung = Math.floor(c % 588 / 28), jong = c % 28;
  const y = [2,3,6,7,12,17,20].includes(jung);
  if (cho === 5) cho = y ? 11 : 2;
  else if (cho === 2 && y) cho = 11;
  return String.fromCharCode(0xAC00 + cho * 588 + jung * 28 + jong);
}
const isSyl = s => /^[가-힣]$/.test(s);
const last = w => w[w.length - 1];
const lab = e => dueum(e) === e ? `‘${e}’` : `‘${e}’(${dueum(e)})`;
function find(q){
  const a = dueum(q);
  return WORDS.filter(w => w.word[0] === q || w.word[0] === a)
    .sort((x,y) => x.grade - y.grade || x.word.localeCompare(y.word,"ko"));
}
const also = q => dueum(q) === q ? "" : `(또는 ‘${dueum(q)}’)`;

const D = {
  a: {
    sum: (q,n) => `<p class="sum">‘${q}’${also(q)}로 시작하는 낱말 ${n}개</p>`,
    group: (t,items) => `<h2>${t}</h2><ul>${items}</ul>`,
    titles: ["초2 낱말","도전 낱말"],
    item: (w,e,n) => `<li class="row">
      <div class="top"><b class="word">${w.word}</b><span class="stamp g${w.grade}">${w.grade<3?"초2":"도전"}</span></div>
      <p class="mean">${w.meaning}</p>
      ${n ? `<button class="next" data-word="${w.word}">${lab(e)}로 이어 쓰기<span>${n}개</span></button>`
          : `<p class="end">한방 낱말이에요. ${lab(e)}로 시작하는 낱말이 없어요.</p>`}
    </li>`,
    trail: t => `<p class="trail">${t.join(" ▸ ")} ▸ ?</p>`,
    empty: q => `<p class="empty">‘${q}’로 시작하는 낱말이 아직 없어요. 다른 글자를 써 보세요.</p>`,
    intro: `<p class="empty">완성된 글자 하나를 써 주세요. 예: 기, 사, 도</p>`
  },
  b: {
    sum: (q,n) => `<p class="sum">‘${q}’${also(q)} 역에서 갈 수 있는 칸 ${n}개</p>`,
    group: (t,items) => `<h2>${t}</h2><ul>${items}</ul>`,
    titles: ["초2 칸","도전 칸"],
    item: (w,e,n) => `<li class="car g${w.grade}">
      <div><span class="word">${w.word}</span><span class="tag">${w.grade<3?"초2":"도전"}</span></div>
      <span class="hook" aria-label="끝 글자">${e}</span>
      <p class="mean">${w.meaning}</p>
      ${n ? `<button class="next" data-word="${w.word}">${lab(e)} 칸 연결하기 (${n})</button>`
          : `<p class="end">종착역이에요! ${lab(e)}로 이을 칸이 없어요.</p>`}
    </li>`,
    trail: t => `<div class="trail">${t.map(x=>`<span>${x}</span>`).join("<i></i>")}</div>`,
    empty: q => `<p class="empty">‘${q}’ 역에서 출발하는 칸이 아직 없어요. 다른 글자를 넣어 보세요.</p>`,
    intro: `<p class="empty">완성된 글자 하나를 넣어 주세요. 예: 기, 사, 도</p>`
  },
  c: {
    sum: (q,n) => `<p class="sum">‘${q}’${also(q)}로 시작하는 카드 <b>${n}장</b>을 찾았어요</p>`,
    group: (t,items) => `<h2>${t}</h2><ul class="grid">${items}</ul>`,
    titles: ["초2 카드","도전 카드"],
    item: (w,e,n) => `<li class="card${n?"":" end"}">
      <span class="stars">${"★".repeat(w.grade)}<small>${["쉬움","초2","도전"][w.grade-1]}</small></span>
      <b class="word">${w.word}</b>
      <p class="mean">${w.meaning}</p>
      ${n ? `<span class="power">이어갈 카드 ${n}장<meter min="0" max="8" value="${n}"></meter></span>
             <button class="next" data-word="${w.word}">${lab(e)} 카드 찾기</button>`
          : `<span class="badge">한방 카드</span><p class="mean">${lab(e)}로 시작하는 카드가 없어요.</p>`}
    </li>`,
    trail: t => `<p class="trail">모은 순서: ${t.join(" ▸ ")}</p>`,
    empty: q => `<p class="empty">‘${q}’ 카드는 아직 없어요. 다른 글자로 찾아보세요.</p>`,
    intro: `<p class="empty">완성된 글자 하나를 넣어 주세요. 예: 기, 사, 도</p>`
  },
  d: {
    sum: (q,n) => `<p class="sum">‘${q}’${also(q)}로 시작하는 말 ${n}개</p>`,
    group: (t,items) => `<h2>${t}</h2><ul>${items}</ul>`,
    titles: ["초2 단어","도전 단어"],
    item: (w,e,n) => `<li class="row">
      <span class="word">${w.word}</span><span class="mark g${w.grade}">${w.grade<3?"초2":"도전"}</span>
      <p class="mean">${w.meaning}</p>
      ${n ? `<button class="next" data-word="${w.word}">${lab(e)}로 이어가기 (${n}개)</button>`
          : `<p class="end">한방 단어! ${lab(e)}로 시작하는 말이 없어요.</p>`}
    </li>`,
    trail: t => `<p class="trail">${t.join(" ▸ ")} ▸ ?</p>`,
    empty: q => `<p class="empty">‘${q}’로 시작하는 말이 아직 없어요.</p>`,
    intro: `<p class="empty">글자 하나를 써 보세요. 예: 기, 사, 도</p>`
  }
};

function mount(id){
  const d = D[id], root = document.getElementById("s-" + id);
  const input = root.querySelector("input"), out = root.querySelector(".out");
  let trail = [];
  const row = w => { const e = last(w.word); return d.item(w, e, find(e).length); };
  function show(q){
    const list = find(q);
    const easy = list.filter(w => w.grade < 3), hard = list.filter(w => w.grade === 3);
    out.innerHTML = (trail.length ? d.trail(trail) : "") + d.sum(q, list.length)
      + (list.length ? "" : d.empty(q))
      + (easy.length ? d.group(d.titles[0], easy.map(row).join("")) : "")
      + (hard.length ? d.group(d.titles[1], hard.map(row).join("")) : "");
  }
  input.addEventListener("input", () => {
    const q = [...input.value.trim()][0];
    trail = [];
    if (q && isSyl(q)) show(q); else out.innerHTML = d.intro;
  });
  out.addEventListener("click", e => {
    const b = e.target.closest("[data-word]");
    if (!b) return;
    trail.push(b.dataset.word);
    const q = last(b.dataset.word);
    input.value = q;
    show(q);
    root.querySelector(".search").scrollIntoView({behavior:"smooth", block:"start"});
  });
  input.value = "기";
  show("기");
}
Object.keys(D).forEach(mount);

// 시안 전환
const tabs = document.querySelectorAll(".picker button");
function pick(id){
  document.querySelectorAll(".draft").forEach(s => s.classList.toggle("on", s.id === "s-" + id));
  tabs.forEach(t => t.setAttribute("aria-selected", t.dataset.to === id));
  history.replaceState(null, "", "#" + id);
}
tabs.forEach(t => t.addEventListener("click", () => pick(t.dataset.to)));
pick(D[location.hash.slice(1)] ? location.hash.slice(1) : "a");
</script>
</body>
