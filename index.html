<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>끝말잇기 낱말 사전</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;background:#e9dccb;font-family:"Gowun Dodum",sans-serif;color:#f4f4ee}
ul{list-style:none;margin:0;padding:0}
button{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid #ffbf00;outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding:28px 16px 64px}
.board{padding:30px 26px 40px;background:#2f4a3c radial-gradient(circle at 30% 20%,#3a5a49,#2f4a3c 70%);border:16px solid #8b5a2b;border-radius:8px;box-shadow:inset 0 0 70px rgba(0,0,0,.35)}
.tray{height:14px;margin:0 24px;background:#a06a3a;border-radius:0 0 8px 8px}
h1{margin:0 0 22px;font:400 44px/1.1 "Black Han Sans",sans-serif}
.search{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px;margin-bottom:22px;font-size:24px;scroll-margin-top:16px}
.chalkbox{width:88px;border-bottom:4px solid #f6e27f}
.chalkbox input{width:100%;padding:0;border:0;background:none;text-align:center;font:400 56px/1.2 "Black Han Sans",sans-serif;color:#f6e27f}
.sum{margin:0 0 10px;font-size:20px;color:#cfe3d6}
.row{padding:14px 0;border-bottom:2px dashed rgba(244,244,238,.22)}
.word{font:400 34px/1.2 "Black Han Sans",sans-serif;vertical-align:middle}
.lv{display:inline-block;margin-left:10px;padding:4px 12px;border-radius:999px;font-size:16px;font-weight:700;color:#1f2d24;vertical-align:middle}
.lv.lv1{background:#8ce99a}.lv.lv3{background:#ffe066}.lv.lv4{background:#ff8787}
.mean{margin:6px 0 8px;font-size:19px;line-height:1.6}
.next{min-height:48px;padding:4px 0;border:0;background:none;color:#9fd8ff;font-size:19px;text-decoration:underline;text-underline-offset:5px}
.end{margin:0;font-size:19px;color:#ffb3b3}
.trail{margin:0 0 10px;font-size:20px;color:#cfe3d6}
.empty{font-size:20px;line-height:1.6}
.source{margin:14px 8px 0;font-size:13px;line-height:1.6;color:#6b5a45}
.source a{color:inherit}
@media (max-width:520px){
  .board{padding:22px 16px 30px;border-width:10px}
  h1{font-size:36px}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="board">
    <h1>오늘의 끝말잇기</h1>
    <label class="search">
      <span class="chalkbox"><input aria-label="첫 글자" autocomplete="off"></span>
      <span>(으)로 시작하는 말은?</span>
    </label>
    <div class="out"></div>
  </div>
  <div class="tray"></div>
  <p class="source">단어와 등급: 국립국어원 「국어 기초 어휘 선정 및 어휘 등급화 목록」(공공누리 제1유형)<br>
  뜻풀이: 국립국어원 <a href="https://krdict.korean.go.kr">한국어기초사전</a>, 일부는 <a href="https://stdict.korean.go.kr">표준국어대사전</a> (CC BY-SA 2.0 KR)</p>
</div>

<script>
// 표시 수준: 1~2등급 쉬움, 3등급 중간, 4등급 어려움
const LEVELS = [
  {name:"쉬움",   cls:"lv1", has:g => g <= 2},
  {name:"중간",   cls:"lv3", has:g => g === 3},
  {name:"어려움", cls:"lv4", has:g => g === 4}
];
const levelOf = g => LEVELS.find(l => l.has(g));

// 두음법칙: 첫소리 ㄹ → ㄴ/ㅇ, ㄴ → ㅇ (ㅑㅒㅕㅖㅛㅠㅣ 앞)
function dueum(s){
  const c = s.charCodeAt(0) - 0xAC00;
  if (c < 0 || c > 11171) return s;
  let cho = Math.floor(c / 588);
  const jung = Math.floor(c % 588 / 28), jong = c % 28;
  const y = [2,3,6,7,12,17,20].includes(jung);
  if (cho === 5) cho = y ? 11 : 2;
  else if (cho === 2 && y) cho = 11;
  return String.fromCharCode(0xAC00 + cho * 588 + jung * 28 + jong);
}
const isSyl = s => /^[가-힣]$/.test(s);
const last = w => w[w.length - 1];
const lab = e => dueum(e) === e ? `‘${e}’` : `‘${e}’(${dueum(e)})`;
const also = q => dueum(q) === q ? "" : `(또는 ‘${dueum(q)}’)`;
// 첫 글자별 단어 목록 (words.json 은 가나다순으로 저장되어 있음)
const BY_FIRST = new Map();
function find(q){
  const a = dueum(q);
  return a === q ? (BY_FIRST.get(q) || [])
    : [...(BY_FIRST.get(q) || []), ...(BY_FIRST.get(a) || [])].sort((x,y) => x.word.localeCompare(y.word,"ko"));
}

const input = document.querySelector("input"), out = document.querySelector(".out");
let trail = [];

function row(w){
  const e = last(w.word), n = find(e).length, l = levelOf(w.grade);
  return `<li class="row">
    <span class="word">${w.word}</span><span class="lv ${l.cls}">${l.name}</span>
    <p class="mean">${w.meaning}</p>
    ${n ? `<button class="next" data-word="${w.word}">${lab(e)}로 이어가기 (${n}개)</button>`
        : `<p class="end">한방 단어! ${lab(e)}로 시작하는 말이 없어요.</p>`}
  </li>`;
}
function show(q){
  const list = find(q);
  out.innerHTML = (trail.length ? `<p class="trail">${trail.join(" ▸ ")} ▸ ?</p>` : "")
    + `<p class="sum">‘${q}’${also(q)}로 시작하는 말 ${list.length}개</p>`
    + (list.length ? `<ul>${list.map(row).join("")}</ul>` : `<p class="empty">‘${q}’로 시작하는 말이 아직 없어요.</p>`);
}
input.addEventListener("input", () => {
  const q = [...input.value.trim()][0];
  trail = [];
  if (q && isSyl(q)) show(q); else out.innerHTML = `<p class="empty">글자 하나를 써 보세요. 예: 기, 사, 도</p>`;
});
out.addEventListener("click", e => {
  const b = e.target.closest("[data-word]");
  if (!b) return;
  trail.push(b.dataset.word);
  const q = last(b.dataset.word);
  input.value = q;
  show(q);
  document.querySelector(".search").scrollIntoView({behavior:"smooth", block:"start"});
});
out.innerHTML = `<p class="empty">단어를 불러오는 중이에요.</p>`;
fetch("words.json").then(r => r.json()).then(data => {
  for (const [word, grade, meaning] of data) {
    const k = word[0];
    if (!BY_FIRST.has(k)) BY_FIRST.set(k, []);
    BY_FIRST.get(k).push({word, grade, meaning});
  }
  input.value = "기";
  show("기");
}).catch(() => { out.innerHTML = `<p class="empty">단어를 불러오지 못했어요. 새로고침해 보세요.</p>`; });
</script>
</body>
</html>
